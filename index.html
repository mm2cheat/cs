<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Công Cụ Tạo Đơn Chung Sức Liên Quân</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --success-bg: #ecfdf5;
      --success-border: #10b981;
      --success-text: #065f46;
      --error-bg: #fef2f2;
      --error-border: #ef4444;
      --error-text: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 500px;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border-color);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    textarea,
    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: #fcfcfd;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea {
      resize: vertical;
      min-height: 110px;
      line-height: 1.5;
    }

    textarea:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      background-color: #ffffff;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    button:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    button:active:not(:disabled) {
      transform: scale(0.99);
    }

    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
      opacity: 0.8;
    }

    #resultBox {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.92rem;
      line-height: 1.5;
      display: none;
      word-break: break-word;
    }

    #resultBox.success {
      display: block;
      background-color: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    #resultBox.error {
      display: block;
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    button:disabled .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }
      .header h1 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Tạo Đơn Chung Sức Liên Quân</h1>
      <p>Hệ thống tự động lọc mã mời và lên đơn qua API</p>
    </div>

    <div class="form-group">
      <label for="rawText">Đoạn văn bản copy từ trong game:</label>
      <textarea 
        id="rawText" 
        placeholder="Ví dụ: Chia sẻ mã mời --zVdqY2Trt9--, [[llxHQdf...]]"
      ></textarea>
      <div class="hint">Hệ thống sẽ tự động lấy mã nằm giữa cặp dấu <strong>--</strong></div>
    </div>

    <div class="form-group">
      <label for="quantity">Số lượng cần tăng:</label>
      <input 
        type="number" 
        id="quantity" 
        value="1" 
        min="1" 
        step="1"
      >
    </div>

    <button id="submitBtn" type="button">
      <span class="spinner"></span>
      <span id="btnText">Tạo Đơn Ngay</span>
    </button>

    <div id="resultBox"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
