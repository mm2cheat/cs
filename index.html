<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Chung Sức Liên Quân</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        textarea, input[type="number"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus, input:focus {
            border-color: #007bff;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            word-wrap: break-word;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .note {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 Tool Chung Sức</h2>
    
    <div class="form-group">
        <label for="apiKey">API Key (Token):</label>
        <input type="password" id="apiKey" placeholder="Nhập mã dvc_... của bạn vào đây">
        <span class="note">Mã này sẽ không bị lưu lại, an toàn khi dùng.</span>
    </div>

    <div class="form-group">
        <label for="inviteText">Dán đoạn text copy từ game:</label>
        <textarea id="inviteText" placeholder="VD: Chia sẻ mã mời --XXXXXXXXXX--, [[llxHQdf... ]]"></textarea>
    </div>

    <div class="form-group">
        <label for="quantity">Số lượng cần chạy:</label>
        <input type="number" id="quantity" value="1" min="1">
    </div>

    <button id="submitBtn" onclick="processOrder()">Tạo Đơn Ngay</button>

    <div id="result"></div>
</div>

<!-- Liên kết với file JavaScript xử lý -->
<script src="script.js"></script>

</body>
</html>
