<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạo đơn Chung Sức Liên Quân</title>
<style>
  :root {
    --bg: #eaf0f8;
    --card: #ffffff;
    --ink: #14213d;
    --muted: #5b6b86;
    --line: #d5dfee;
    --accent: #1f5eff;
    --accent-dark: #1648c9;
    --ok: #12804a;
    --ok-bg: #e6f6ee;
    --err: #b42333;
    --err-bg: #fdecee;
    --warn: #8a5a00;
    --warn-bg: #fff4dc;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  main { width: 100%; max-width: 580px; }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; letter-spacing: -0.01em; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: 0.95rem; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 8px 28px rgba(20, 33, 61, 0.07);
  }
  label { display: block; font-weight: 600; font-size: 0.92rem; margin: 0 0 6px; }
  .field { margin-bottom: 16px; }
  .hint { color: var(--muted); font-size: 0.82rem; margin: 6px 0 0; }

  textarea, input[type="number"], input[type="password"], select {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: #f8fafd;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 11px 12px;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea { min-height: 112px; resize: vertical; }
  textarea:focus, input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(31, 94, 255, 0.18);
    background: #fff;
  }
  .row { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
  @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }

  .actions { display: flex; gap: 10px; margin-top: 4px; }
  button {
    font: inherit;
    font-weight: 700;
    border: 0;
    border-radius: 10px;
    padding: 13px 18px;
    cursor: pointer;
    transition: background .15s, transform .05s, opacity .15s;
  }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:focus-visible { outline: 3px solid rgba(31, 94, 255, 0.4); outline-offset: 2px; }
  #submitBtn { flex: 1; background: var(--accent); color: #fff; }
  #submitBtn:hover:not(:disabled) { background: var(--accent-dark); }
  #cancelBtn { background: #e8edf6; color: var(--ink); }
  #cancelBtn:hover:not(:disabled) { background: #d9e1ef; }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  #cancelBtn[hidden] { display: none; }

  /* Tiến độ */
  #progressPanel { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
  #progressPanel[hidden] { display: none; }
  .progress-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  #percent { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  #counter { color: var(--muted); font-size: 0.92rem; font-variant-numeric: tabular-nums; text-align: right; }
  .track {
    height: 14px;
    border-radius: 999px;
    background: #e3eaf6;
    overflow: hidden;
    margin: 8px 0 6px;
  }
  .fill {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: var(--accent);
    transition: width .35s ease, background .2s;
  }
  .fill.done { background: var(--ok); }
  .fill.failed { background: var(--err); }
  .fill.indeterminate {
    width: 40% !important;
    animation: slide 1.1s ease-in-out infinite alternate;
  }
  @keyframes slide { from { margin-left: 0; } to { margin-left: 60%; } }
  #status { color: var(--muted); font-size: 0.88rem; min-height: 1.3em; }

  #log {
    list-style: none;
    margin: 12px 0 0;
    padding: 0;
    max-height: 190px;
    overflow-y: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 0.85rem;
    background: #f8fafd;
  }
  #log:empty { display: none; }
  #log li { padding: 7px 12px; border-bottom: 1px solid var(--line); word-break: break-all; }
  #log li:last-child { border-bottom: 0; }
  #log li.ok { color: var(--ok); }
  #log li.err { color: var(--err); }
  #log li.warn { color: var(--warn); }

  /* Thông báo kết quả */
  #result {
    display: none;
    margin-top: 16px;
    padding: 13px 14px;
    border-radius: 10px;
    font-size: 0.95rem;
    border: 1px solid transparent;
    word-break: break-word;
  }
  #result.show { display: block; }
  #result.success { background: var(--ok-bg); color: var(--ok); border-color: #b9e4cf; }
  #result.error { background: var(--err-bg); color: var(--err); border-color: #f4c3c9; }
  #result strong { display: block; margin-bottom: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .fill { transition: none; }
    .fill.indeterminate { animation: none; width: 100% !important; opacity: .6; }
  }
</style>
</head>
<body>
<main>
  <h1>Tạo đơn Chung Sức Liên Quân</h1>
  <p class="sub">Dán đoạn chia sẻ từ game, chọn số lượng rồi bấm tạo đơn.</p>

  <section class="card">
    <div class="field">
      <label for="shareText">Đoạn text copy từ game</label>
      <textarea id="shareText" placeholder="Chia sẻ mã mời --zVdqY2Trt9--, [[llxHQdf...]]"></textarea>
      <p class="hint">Công cụ tự lấy mã nằm giữa hai dấu gạch ngang.</p>
    </div>

    <div class="row">
      <div class="field">
        <label for="quantity">Số lượng</label>
        <input type="number" id="quantity" value="1" min="1" max="100" step="1" inputmode="numeric">
      </div>
      <div class="field">
        <label for="mode">Cách gửi đơn</label>
        <select id="mode">
          <option value="split">Tách từng đơn (thanh tiến độ thật)</option>
          <option value="single">Gộp thành 1 đơn</option>
        </select>
      </div>
    </div>

    <div class="field" id="keyField" hidden>
      <label for="apiKeyInput">API Key dịch vụ</label>
      <input type="password" id="apiKeyInput" placeholder="Dán API Key (lưu trong trình duyệt này)" autocomplete="off">
      <p class="hint">Chỉ hiện khi DVC_API_KEY trong script.js đang để trống.</p>
    </div>

    <div class="actions">
      <button type="button" id="submitBtn">Tạo Đơn Ngay</button>
      <button type="button" id="cancelBtn" hidden>Dừng</button>
    </div>

    <div id="progressPanel" hidden>
      <div class="progress-head">
        <span id="percent">0%</span>
        <span id="counter">0 / 0 đơn</span>
      </div>
      <div class="track" role="progressbar" aria-label="Tiến độ tạo đơn" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="fill" id="fill"></div>
      </div>
      <div id="status" aria-live="polite"></div>
      <ul id="log"></ul>
    </div>

    <div id="result" role="status" aria-live="polite"></div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
